# Netlify config for bradsebastian.com — a static site, no build step.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/BradSebastian_Resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/energy-ogre"
  to = "/energy-ogre-work-samples/"
  status = 301
